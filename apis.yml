name: Bowery
description: Bowery Farming was an American indoor vertical-farming (controlled-environment
  agriculture) company headquartered in New York City that grew leafy greens and herbs
  in automated, pesticide-free indoor farms serving major East Coast metro areas. Once
  valued at roughly $2.3 billion and backed by investors including Bloomberg Beta and
  SV Angel, the company ceased operations in November 2024 and its facilities and equipment
  entered liquidation through 2025-2026. Bowery published no public developer API, SDK,
  documentation, or discovery surface; this API Evangelist profile records the company's
  identity and its probed domain-security posture only.
